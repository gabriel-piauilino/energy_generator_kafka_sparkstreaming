
# =============================================================
# Rede interna compartilhada por todos os serviços
# =============================================================
networks:
  hidro-net:
    driver: bridge

# (sem named volume — usamos bind mount direto em ./lakehouse)

# =============================================================
# SERVIÇOS
# =============================================================
services:

  # -----------------------------------------------------------
  # 1. Zookeeper
  # -----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [hidro-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -----------------------------------------------------------
  # 2. Kafka Broker
  # -----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [hidro-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST → acessível de fora do Docker (localhost:9092)
      # PLAINTEXT       → acessível internamente entre containers (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # criamos explicitamente abaixo
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=WARN"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # -----------------------------------------------------------
  # 3. Criação do tópico (roda uma vez e sai)
  # -----------------------------------------------------------
  topic-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: topic-init
    networks: [hidro-net]
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic energia-hidreletrica --partitions 5 --replication-factor 1 && echo '>>> Topico criado com sucesso.'"
    restart: "no"

  # -----------------------------------------------------------
  # 4. Kafka UI  (http://localhost:8080)
  # -----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks: [hidro-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  # -----------------------------------------------------------
  # Base Python — imagem compartilhada por producer + jobs Spark
  # -----------------------------------------------------------
  # (build context = raiz do repo)

  # -----------------------------------------------------------
  # 5. Simulador / Producer
  # -----------------------------------------------------------
  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: simulator
    networks: [hidro-net]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      TOPIC: energia-hidreletrica
      EVENTS_PER_SECOND: "60"
      ANOMALY_PROBABILITY: "0.025"
      MAINTENANCE_PROBABILITY: "0.003"
    command: ["python", "-m", "producer.simulator"]
    restart: unless-stopped

  # -----------------------------------------------------------
  # 6. Job Bronze
  # -----------------------------------------------------------
  bronze:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: bronze
    networks: [hidro-net]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ../lakehouse:/app/lakehouse
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "consumer.jobs.bronze_ingest"]
    restart: unless-stopped

  # -----------------------------------------------------------
  # 7. Job Silver
  # -----------------------------------------------------------
  silver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: silver
    networks: [hidro-net]
    depends_on:
      bronze:
        condition: service_started
    volumes:
      - ../lakehouse:/app/lakehouse
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "consumer.jobs.silver_transform"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import os,time; base='/app/lakehouse/silver'; files=[os.path.join(r,f) for r,_,fs in os.walk(base) for f in fs if f.endswith('.parquet')]; latest=max((os.path.getmtime(p) for p in files),default=0); exit(0 if time.time()-latest<300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # -----------------------------------------------------------
  # 8. Job Gold
  # -----------------------------------------------------------
  gold:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: gold
    networks: [hidro-net]
    depends_on:
      silver:
        condition: service_started
    volumes:
      - ../lakehouse:/app/lakehouse
    command: ["python", "-m", "consumer.jobs.gold_aggregations"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import os,time; base='/app/lakehouse/gold'; files=[os.path.join(r,f) for r,_,fs in os.walk(base) for f in fs if f.endswith('.parquet')]; latest=max((os.path.getmtime(p) for p in files),default=0); exit(0 if time.time()-latest<600 else 1)"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 180s

  # -----------------------------------------------------------
  # 9. Dashboard Streamlit  (http://localhost:8501)
  # -----------------------------------------------------------
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: dashboard
    networks: [hidro-net]
    depends_on:
      - gold
    ports:
      - "8501:8501"
    volumes:
      - ../lakehouse:/app/lakehouse
    command: ["streamlit", "run", "dashboard/app.py",
              "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true"]
    restart: unless-stopped
